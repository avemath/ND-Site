<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nicholas Domke | Mechanical Engineering</title>
  <meta name="description" content="Nicholas Domke, mechanical engineering senior at LSU with a robotics minor and a computer science minor in progress. He designs and builds robot hardware: underwater vehicle mounts, robot arms, and path planning for unmanned surface vessels.">
  <meta name="theme-color" content="#000000">
  <!-- Link previews (texts, LinkedIn, Slack) and search engines need full addresses.
       If the site moves to Nicholas's GitHub, update the three URLs below
       (canonical, og:url, og:image). The README lists every spot to change. -->
  <link rel="canonical" href="https://avemath.github.io/nmdomke/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nicholas Domke">
  <meta property="og:title" content="Nicholas Domke | Mechanical Engineering">
  <meta property="og:description" content="Mechanical engineering senior at LSU with a robotics minor and a computer science minor in progress. He designs and builds robot hardware: underwater vehicle mounts, robot arms, and path planning for unmanned surface vessels.">
  <meta property="og:url" content="https://avemath.github.io/nmdomke/">
  <meta property="og:image" content="https://avemath.github.io/nmdomke/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nicholas Domke, Mechanical Engineering, LSU, Class of 2027">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image:alt" content="Nicholas Domke, Mechanical Engineering, LSU, Class of 2027">
  <!-- three.js, pinned, for the 3D CAD model on the welding arm card. Nothing is
       downloaded until that card is about to scroll into view (assets/js/model3d.js). -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght,ROND@700..900,100&family=Space+Grotesk:wght@300..600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <noscript><style>main > :not(.hero), .scroll-cue, .bar-right { display: none !important; }</style></noscript>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="bar">
    <a class="bar-name dot" href="#top" id="bar-name" aria-label="Nicholas Domke, back to top">Nicholas Domke</a>
    <span class="bar-sec mono" aria-hidden="true"></span>
    <div class="bar-right">
      <span class="gear" aria-hidden="true" title="Scroll progress"></span>
      <button class="pill pill-ghost menu-btn" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
    </div>
  </header>

  <!-- Full-screen menu -->
  <div class="menu" id="menu" hidden>
    <div class="menu-dots" aria-hidden="true"></div>
    <nav aria-label="Site menu">
      <ul class="menu-list">
        <li><a href="#about" data-scramble>About</a></li>
        <li><a href="#featured" data-scramble>Projects</a></li>
        <li><a href="#experience" data-scramble>Experience</a></li>
        <li><a href="#skills" data-scramble>Skills</a></li>
        <li><a href="#contact" data-scramble>Contact</a></li>
      </ul>
    </nav>
  </div>

  <main id="main">
    <!-- Everything below is filled in from content.js by assets/js/render.js.
         Panes alternate dark / light / blue to give the page rhythm. -->

    <!-- DARK: hero -->
    <section class="pane pane-dark hero" id="top" data-pane="dark">
      <canvas class="dotfield" aria-hidden="true"></canvas>
      <div class="hero-inner" data-slot="hero">
        <noscript>
          <h1 class="hero-name dot"><span>Nicholas</span><span>Domke</span></h1>
          <p class="tagline">This site needs JavaScript to show the full portfolio. Reach Nicholas at
            <a href="mailto:nmdomke2004@gmail.com">nmdomke2004@gmail.com</a> or on
            <a href="https://www.linkedin.com/in/nicholas-domke/">LinkedIn</a>.</p>
        </noscript>
      </div>
      <a class="scroll-cue mono" href="#intro">Scroll</a>
    </section>

    <!-- LIGHT: numbers + about -->
    <div class="pane pane-light" id="intro" data-pane="light">
      <div class="numbers" data-slot="numbers"></div>
      <section class="sec" id="about" aria-labelledby="about-h">
        <h2 class="sec-h dot" id="about-h" data-scramble>About</h2>
        <div data-slot="about"></div>
      </section>
    </div>

    <!-- WHITE: featured + projects -->
    <div class="pane pane-light pane-white" data-pane="white">
      <section class="sec" id="featured" aria-labelledby="feat-h">
        <h2 class="sec-h dot" id="feat-h" data-scramble>Projects</h2>
        <div data-slot="featured"></div>
      </section>
      <section class="sec sec-tight" id="projects" aria-label="More projects">
        <div class="spots" data-slot="spotlights"></div>
        <div class="cards" data-slot="projects"></div>
      </section>
      <section class="sec sec-tight robots" id="robots" aria-labelledby="robots-h" hidden>
        <div data-slot="robots"></div>
      </section>
    </div>

    <!-- LIGHT: experience -->
    <div class="pane pane-light" data-pane="light">
      <section class="sec" id="experience" aria-labelledby="exp-h">
        <h2 class="sec-h dot" id="exp-h" data-scramble>Experience</h2>
        <div data-slot="experience"></div>
      </section>
    </div>

    <!-- BLUE: coursework marquee -->
    <div class="pane pane-blue marquee" id="coursework" data-pane="blue" data-slot="coursework"></div>

    <!-- WHITE: skills -->
    <div class="pane pane-light pane-white" data-pane="white">
      <section class="sec" id="skills" aria-labelledby="skills-h">
        <h2 class="sec-h dot" id="skills-h" data-scramble>Skills</h2>
        <div data-slot="skills"></div>
      </section>
    </div>

    <!-- BLUE: hobbies. Stays hidden unless content.js has a "hobbies" block. -->
    <div class="pane pane-blue" id="hobbies-pane" data-pane="blue" hidden>
      <section class="sec" id="hobbies" aria-labelledby="hobbies-h">
        <h2 class="sec-h dot" id="hobbies-h" data-scramble>Off the clock</h2>
        <div data-slot="hobbies"></div>
      </section>
    </div>

    <!-- DARK: contact -->
    <section class="pane pane-dark contact" id="contact" aria-label="Contact" data-pane="dark">
      <canvas class="dotfield" aria-hidden="true"></canvas>
      <div class="contact-inner">
        <p class="mono label">Contact</p>
        <h2 class="contact-h dot" data-scramble>Let's talk</h2>
        <div data-slot="contact"></div>
      </div>
    </section>
  </main>

  <footer class="pane pane-dark foot mono" data-pane="dark" data-slot="footer"></footer>



  <!-- content.js must load before render.js -->
  <!-- content-guard.js turns a mistake in content.js into a clear message instead of a blank page -->
  <script src="assets/js/content-guard.js"></script>
  <script src="content.js" onerror="window.SITE_ERROR = { message: 'content.js could not be loaded. It may be missing, renamed, or not in the main folder.', line: 0 }"></script>
  <script src="assets/js/drawings.js"></script>
  <script src="assets/js/model3d.js"></script>
  <script src="assets/js/render.js"></script>
</body>
</html>
