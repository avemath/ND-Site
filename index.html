</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="bar">
    <a class="bar-name dot" href="#top" id="bar-name" aria-label="Nicholas Domke, back to top">Nicholas Domke</a>
    <button class="pill pill-ghost menu-btn" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
  </header>

  <!-- Full-screen menu -->
  <div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Site menu" hidden>
    <div class="menu-dots" aria-hidden="true"></div>
    <nav aria-label="Sections">
      <ul class="menu-list">
        <li><a href="#about" data-scramble>About</a></li>
        <li><a href="#featured" data-scramble>Projects</a></li>
        <li><a href="#experience" data-scramble>Experience</a></li>
        <li><a href="#skills" data-scramble>Skills</a></li>
        <li><a href="#contact" data-scramble>Contact</a></li>
      </ul>
    </nav>
  </div>

  <main id="main">
    <!-- Everything below is filled in from content.js by assets/js/render.js.
         Panes alternate dark / light / red to give the page rhythm. -->

    <!-- DARK: hero -->
    <section class="pane pane-dark hero" id="top" data-pane="dark">
      <canvas class="dotfield" aria-hidden="true"></canvas>
      <div class="hero-inner" data-slot="hero"></div>
      <a class="scroll-cue mono" href="#about">Scroll</a>
    </section>

    <!-- LIGHT: numbers + about -->
    <div class="pane pane-light" data-pane="light">
      <div class="numbers" data-slot="numbers"></div>
      <section class="sec" id="about" aria-labelledby="about-h">
        <h2 class="sec-h dot" id="about-h" data-scramble>About</h2>
        <div data-slot="about"></div>
      </section>
    </div>

    <!-- DARK: featured + projects -->
    <div class="pane pane-dark" data-pane="dark">
      <section class="sec" id="featured" aria-labelledby="feat-h">
        <h2 class="sec-h dot" id="feat-h" data-scramble>Projects</h2>
        <div data-slot="featured"></div>
      </section>
      <section class="sec sec-tight" id="projects" aria-label="More projects">
        <div class="cards" data-slot="projects"></div>
      </section>
    </div>

    <!-- LIGHT: experience -->
    <div class="pane pane-light" data-pane="light">
      <section class="sec" id="experience" aria-labelledby="exp-h">
        <h2 class="sec-h dot" id="exp-h" data-scramble>Experience</h2>
        <div data-slot="experience"></div>
      </section>
    </div>

    <!-- RED: coursework marquee -->
    <div class="pane pane-red marquee" data-pane="red" data-slot="coursework"></div>

    <!-- LIGHT: skills -->
    <div class="pane pane-light" data-pane="light">
      <section class="sec" id="skills" aria-labelledby="skills-h">
        <h2 class="sec-h dot" id="skills-h" data-scramble>Skills</h2>
        <div data-slot="skills"></div>
      </section>
    </div>

    <!-- RED: hobbies. Stays hidden unless content.js has a "hobbies" block. -->
    <div class="pane pane-red" id="hobbies-pane" data-pane="red" hidden>
      <section class="sec" id="hobbies" aria-labelledby="hobbies-h">
        <h2 class="sec-h dot" id="hobbies-h" data-scramble>Off the clock</h2>
        <div data-slot="hobbies"></div>
      </section>
    </div>

    <!-- DARK: contact -->
    <section class="pane pane-dark contact" id="contact" aria-label="Contact" data-pane="dark">
      <canvas class="dotfield" aria-hidden="true"></canvas>
      <div class="contact-inner">
        <p class="mono label">Contact</p>
        <h2 class="contact-h dot" data-scramble>Let's talk</h2>
        <div data-slot="contact"></div>
      </div>
    </section>
  </main>

  <footer class="pane pane-dark foot mono" data-pane="dark" data-slot="footer"></footer>

  <noscript><p class="noscript">This site needs JavaScript turned on to show its content.</p></noscript>

  <!-- content.js must load before render.js -->
  <script src="content.js"></script>
  <script src="assets/js/drawings.js"></script>
  <script src="assets/js/render.js"></script>
</body>
</html>
